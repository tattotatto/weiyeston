name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Go 后端测试 + Lint
  go-test:
    name: Go Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weiyeston_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Run Go tests
        env:
          WEIYESTON_DATABASE_HOST: localhost
          WEIYESTON_DATABASE_PORT: 5432
          WEIYESTON_DATABASE_USER: postgres
          WEIYESTON_DATABASE_PASSWORD: postgres
          WEIYESTON_DATABASE_DBNAME: weiyeston_test
          WEIYESTON_JWT_SECRET: ci-test-secret
          WEIYESTON_REDIS_ADDR: localhost:6379
        run: go test -v -race -coverprofile=coverage.out ./...

  # Job 2: 前端测试
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

  # Job 3: Docker 构建
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: weiyeston:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
