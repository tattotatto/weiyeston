# config.dev.yaml — 开发环境配置（可覆盖 config.yaml 中的值）

server:
  port: 8080
  mode: debug

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: weiyeston
  sslmode: disable

redis:
  addr: localhost:6379
  password: ""
  db: 0

jwt:
  secret: "dev-secret-change-in-production"

wechat:
  server_url: "http://localhost:8080"

upload:
  driver: local
  local_path: ./uploads

log:
  level: debug
  format: console
  output: stdout

ai:
  provider: deepseek
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:8080"
