# .air.toml
root = "."
tmp_dir = ".air"
testdata_dir = "testdata"

[build]
  cmd = "go build -o ./.air/weiyeston ./cmd/server"
  bin = "./.air/weiyeston --config=config.yaml"
  full_bin = ""
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = [".air", "web", "node_modules", "vendor", ".git"]
  include_dir = []
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  log = "build-errors.log"
  delay = 1000
  stop_on_error = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
