# config.yaml — 默认配置文件（开发环境）

server:
  port: 8080
  mode: debug                      # debug | release | test
  read_timeout: 30s
  write_timeout: 60s

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: weiyeston
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret: "change-me-in-production-use-env-var"
  expiration: 24h
  access_expiration: 2h
  refresh_expiration: 168h
  issuer: weiyeston-v2

wechat:
  component_app_id: ""
  component_app_secret: ""
  token: ""
  encoding_aes_key: ""
  server_url: "https://your-domain.com"

upload:
  driver: local
  local_path: ./uploads
  max_size_mb: 20
  s3_endpoint: ""
  s3_bucket: ""
  s3_region: ""
  s3_key: ""
  s3_secret: ""

log:
  level: info
  format: console
  output: stdout
  file: ""

ai:
  provider: deepseek
  base_url: "https://api.deepseek.com"
  api_key: ""
  model: "deepseek-chat"
  timeout: 60s

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:8080"
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
    - X-Requested-With
