# docker-compose.yml — 本地开发环境
version: '3.9'

services:
  # ============ PostgreSQL 16 ============
  postgres:
    image: postgres:16-alpine
    container_name: weiyeston-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weiyeston
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weiyeston"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============ Redis 7 ============
  redis:
    image: redis:7-alpine
    container_name: weiyeston-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============ Go 后端 (air 热重载) ============
  server:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: weiyeston-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - WEIYESTON_SERVER_PORT=8080
      - WEIYESTON_SERVER_MODE=debug
      - WEIYESTON_DATABASE_HOST=postgres
      - WEIYESTON_DATABASE_PORT=5432
      - WEIYESTON_DATABASE_USER=postgres
      - WEIYESTON_DATABASE_PASSWORD=postgres
      - WEIYESTON_DATABASE_DBNAME=weiyeston
      - WEIYESTON_DATABASE_SSLMODE=disable
      - WEIYESTON_REDIS_ADDR=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============ 前端开发服务器 (Vite HMR) ============
  web:
    image: node:20-alpine
    container_name: weiyeston-web
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./web/admin:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
