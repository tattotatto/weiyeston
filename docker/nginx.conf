# 微盈通 V2 - Nginx 容器配置
# 微信回调必须 HTTPS，请先运行 certbot 获取证书再启用 HTTPS 部分

upstream backend {
    server server:8080;
    keepalive 32;
}

# ============================================================================
# HTTPS 主站 (启用 HTTPS 时取消注释此 block，给 server_name 填入真实域名)
