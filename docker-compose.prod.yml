# 微盈通 V2 - docker-compose 生产部署
# 启动: docker compose -f docker-compose.prod.yml up -d
# 注意: 微信回调需要 HTTPS，生产环境请配置 SSL 证书或使用 CDN

version: '3.9'

services:
  # ============ Nginx 反向代理 ============
  nginx:
    image: nginx:1.27-alpine
    container_name: weiyeston-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # HTTPS（配置证书后启用）
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./ssl:/etc/ssl:ro  # SSL 证书目录
      - uploads_data:/app/uploads:ro
    depends_on:
      - server
    networks:
      - weiyeston

  # ============ Go 后端服务 ============
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: weiyeston-v2:latest
    container_name: weiyeston-server
    restart: unless-stopped
    environment:
      # 服务配置
      - WEIYESTON_SERVER_PORT=8080
      - WEIYESTON_SERVER_MODE=release
      # 数据库
      - WEIYESTON_DATABASE_HOST=postgres
      - WEIYESTON_DATABASE_PORT=5432
      - WEIYESTON_DATABASE_USER=${DB_USER:-weiyeston}
      - WEIYESTON_DATABASE_PASSWORD=${DB_PASSWORD}
      - WEIYESTON_DATABASE_DBNAME=${DB_NAME:-weiyeston}
      - WEIYESTON_DATABASE_SSLMODE=disable
      # Redis
      - WEIYESTON_REDIS_ADDR=redis:6379
      # JWT
      - WEIYESTON_JWT_SECRET=${JWT_SECRET}
      - WEIYESTON_JWT_EXPIRATION=24h
      # 微信
      - WEIYESTON_WECHAT_COMPONENT_APP_ID=${WECHAT_COMPONENT_APP_ID}
      - WEIYESTON_WECHAT_COMPONENT_APP_SECRET=${WECHAT_COMPONENT_APP_SECRET}
      - WEIYESTON_WECHAT_TOKEN=${WECHAT_TOKEN}
      - WEIYESTON_WECHAT_ENCODING_AES_KEY=${WECHAT_ENCODING_AES_KEY}
      - WEIYESTON_WECHAT_SERVER_URL=${WECHAT_SERVER_URL}
      # 上传
      - WEIYESTON_UPLOAD_LOCAL_PATH=/app/uploads
      - WEIYESTON_UPLOAD_MAX_SIZE_MB=50
      # AI (可选)
      - WEIYESTON_AI_PROVIDER=${AI_PROVIDER:-}
      - WEIYESTON_AI_BASE_URL=${AI_BASE_URL:-}
      - WEIYESTON_AI_API_KEY=${AI_API_KEY:-}
      - WEIYESTON_AI_MODEL=${AI_MODEL:-}
      # CORS
      - WEIYESTON_CORS_ALLOWED_ORIGINS=${CORS_ORIGINS:-http://localhost}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - weiyeston

  # ============ PostgreSQL 16 ============
  postgres:
    image: postgres:16-alpine
    container_name: weiyeston-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-weiyeston}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-weiyeston}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-weiyeston} -d ${DB_NAME:-weiyeston}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weiyeston
    # 不暴露端口到宿主机，仅内部网络可访问
    # ports:
    #   - "5432:5432"

  # ============ Redis 7 ============
  redis:
    image: redis:7-alpine
    container_name: weiyeston-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weiyeston

volumes:
  pgdata:
  redisdata:
  uploads_data:

networks:
  weiyeston:
    driver: bridge
