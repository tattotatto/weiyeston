{{define "head"}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f5f5; color: #333; }
  .article-container { max-width: 720px; margin: 0 auto; padding: 16px; background: #fff; min-height: 100vh; }
  .article-header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #eee; }
  .article-title { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 12px; line-height: 1.4; }
  .article-meta { font-size: 13px; color: #999; display: flex; gap: 12px; flex-wrap: wrap; }
  .article-meta span { white-space: nowrap; }
  .article-content { font-size: 16px; line-height: 1.8; color: #333; word-wrap: break-word; }
  .article-content img { max-width: 100%; height: auto; border-radius: 6px; margin: 8px 0; }
  .article-content p { margin-bottom: 12px; }
  .article-content h1, .article-content h2, .article-content h3 { margin: 16px 0 8px; }
  .article-content h1 { font-size: 22px; }
  .article-content h2 { font-size: 18px; }
  .article-content h3 { font-size: 16px; }
  .article-content blockquote { border-left: 3px solid #1890ff; padding-left: 12px; color: #666; margin: 12px 0; }
  .article-cover { width: 100%; border-radius: 8px; margin-bottom: 16px; aspect-ratio: 16/9; object-fit: cover; }
  .article-footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #eee; text-align: center; color: #999; font-size: 13px; }
  .share-bar { display: flex; justify-content: center; gap: 24px; margin-top: 16px; }
  .share-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid #d9d9d9; background: #fff; font-size: 14px; cursor: pointer; }
  .share-btn.active { border-color: #1890ff; color: #1890ff; }
</style>
{{end}}

{{define "body"}}
<div class="article-container">
    {{if .Article.CoverURL}}
    <img class="article-cover" src="{{.Article.CoverURL}}" alt="封面" />
    {{end}}
    <div class="article-header">
        <h1 class="article-title">{{.Article.Title}}</h1>
        <div class="article-meta">
            {{if .Article.Author}}<span>作者: {{.Article.Author}}</span>{{end}}
            {{if .Article.PublishedAt}}<span>{{.Article.PublishedAt}}</span>{{end}}
            <span>{{.Article.ViewCount}} 次阅读</span>
        </div>
    </div>
    <div class="article-content">
        {{.HTMLContent}}
    </div>
    <div class="article-footer">
        <p>微盈通 · 微官网</p>
        <div class="share-bar">
            <button class="share-btn" onclick="shareArticle('wechat')">分享到微信</button>
            <button class="share-btn" onclick="shareArticle('moments')">分享朋友圈</button>
        </div>
    </div>
</div>

<script>
function shareArticle(platform) {
  // 微信 JSSDK 分享
  if (window.wx && window.wx.ready) {
    window.wx.ready(function() {
      var shareData = {
        title: '{{.Article.Title}}',
        desc: '{{.Article.Summary}}',
        link: window.location.href,
        imgUrl: '{{.Article.CoverURL}}',
      };
      if (platform === 'wechat') {
        window.wx.onMenuShareAppMessage(shareData);
      } else {
        window.wx.onMenuShareTimeline(shareData);
      }
    });
  } else {
    alert('请点击右上角菜单分享');
  }
}
</script>
{{end}}
